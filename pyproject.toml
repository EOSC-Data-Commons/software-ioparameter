[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-ioparameter-vocabulary"
version = "0.2.0"
description = "Validation support for the Software Input/Output Parameter Vocabulary"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = [
  "rdflib>=7.0",
  "pyshacl>=0.30"
]

[tool.setuptools]
packages = []
